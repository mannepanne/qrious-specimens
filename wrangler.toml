# ABOUT: Cloudflare Workers configuration
# ABOUT: Serves the Vite SPA as static assets; Worker handles API routes and SPA routing fallback

name = "qrious-specimens"
compatibility_date = "2025-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# Cloudflare Images delivery hash — NOT a secret (appears in every image URL)
# Find in: Cloudflare dashboard → Images → Overview → "Your images are served from"
# e.g. https://imagedelivery.net/XXXXXX/<image_id>/<variant>  ← XXXXXX is the hash
CF_IMAGES_DELIVERY_HASH = "3c8s33-8vy1yKLZpGBolkQ"

# Secrets — set via `wrangler secret put <NAME>` (never in this file):
#   GEMINI_API_KEY
#   ANTHROPIC_API_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_JWT_SECRET       (legacy HS256 projects only — modern JWKS-signed projects don't need this)
#   RESEND_API_KEY            (contact form admin notification emails)
#   CF_ACCOUNT_ID             (Cloudflare account ID — right sidebar on any CF dashboard page)
#   CF_IMAGES_TOKEN           (CF API token with Images:Edit permission)

# Rate limiting — /api/contact: max 5 requests per IP per 60 seconds
# namespace_id is an arbitrary unique integer that scopes this limiter
# In local dev (wrangler dev), this binding is simulated and always succeeds
[[unsafe.bindings]]
name = "CONTACT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Rate limiting — /api/generate-creature: max 5 requests per authenticated user per 60 seconds.
# Keyed on the verified Supabase JWT `sub` (user UUID), not IP, so a shared NAT doesn't punish
# unrelated users. Cap covers cache hits as well as full Gemini+Claude generations to bound
# total request volume against credential-stuffing or replay attacks. The `simple` binding only
# accepts period 10 or 60, so 5/min is the tightest practical setting.
[[unsafe.bindings]]
name = "GENERATE_CREATURE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Global backstop on /api/generate-creature. Per-user limit prevents abuse from a single
# stolen token; this binding adds Sybil resistance against an attacker who registers many
# accounts to multiply the per-user cap. Constant key (`global`) so every request shares the
# same bucket. Cap of 100/min sits well above any realistic legitimate concurrent-user load
# while bounding worst-case Gemini+Claude spend. If a real user ever hits this, it's the
# signal we need to revisit capacity planning.
[[unsafe.bindings]]
name = "GENERATE_CREATURE_GLOBAL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 100, period = 60 }

# Rate limiting — /api/admin-delete-user: max 3 requests per admin caller per 60 seconds.
# Keyed on the verified caller sub. Admin tooling is low-volume and destructive, so the cap is
# tight enough to slow down a stolen session yet loose enough to absorb a normal multi-delete
# session.
[[unsafe.bindings]]
name = "ADMIN_DELETE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 3, period = 60 }
